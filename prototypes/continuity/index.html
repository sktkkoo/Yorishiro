<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f3ed">
    <title>Yorishiro</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="app-header">
      <a class="brand" href="#conversation-heading" aria-label="Yorishiro、会話へ">
        <svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true"><path d="M14 23V12M14 17C5 17 4 9 5 5c5 0 9 3 9 8M14 14c0-6 4-9 9-9 1 5-1 12-9 12"/></svg>
        <span>Yorishiro</span>
      </a>
      <div class="header-actions">
        <button type="button" class="notebook-toggle" data-action="notebook" aria-controls="notebook" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7a3 3 0 0 1 3 3v14a4 4 0 0 0-4-2H4ZM14 7a3 3 0 0 1 3-3h3v15h-2a4 4 0 0 0-4 2M7 8h3M7 12h3"/></svg>
          <span>いまの理解</span>
        </button>
      </div>
    </header>

    <main class="shared-room">
      <section class="presence" aria-label="より">
        <div class="presence-light" aria-hidden="true"></div>
        <div id="character-stage" aria-label="よりのVRMキャラクター">
          <img id="character-fallback" src="../../public/models/Yori-thumbnail.png" alt="よりのプレビュー">
        </div>
        <p id="character-load" role="status">キャラクターを読み込んでいます</p>
        <div class="character-caption">
          <div class="character-name"><strong>より</strong><span class="status-dot" aria-hidden="true"></span><span id="presence-state" role="status"></span></div>
          <p id="presence-footnote"></p>
        </div>
      </section>

      <section class="conversation-pane" aria-labelledby="conversation-heading">
        <h1 id="conversation-heading" class="sr-only" tabindex="-1">よりとの会話</h1>
        <div class="conversation-flow">
          <div id="conversation-log" role="log" aria-label="よりとの会話" aria-live="polite" aria-relevant="additions text"></div>
          <div id="story-detail"></div>
        </div>
        <div class="composer-area">
          <div id="sample-replies" class="sample-replies" aria-label="会話の例"></div>
          <form id="conversation-form" class="conversation-composer">
            <label class="sr-only" for="message-input">よりに話す</label>
            <textarea id="message-input" rows="2" maxlength="2000" placeholder="よりに話す"></textarea>
            <button id="send-message" class="send-button" type="submit" aria-label="送る" title="送る">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg>
            </button>
          </form>
        </div>
      </section>

      <aside id="notebook" class="notebook" aria-labelledby="notebook-title" hidden>
        <header class="notebook-header">
          <h2 id="notebook-title">いまの理解</h2>
          <button class="icon-button" type="button" data-action="close-notebook" aria-label="いまの理解を閉じる">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg>
          </button>
        </header>
        <div id="notebook-content"></div>
      </aside>
    </main>

    <footer class="app-footer">
      <button type="button" class="demo-caption" data-action="about"><span class="demo-mark" aria-hidden="true"></span>デモ · AI未接続</button>
      <div class="demo-controls">
        <button type="button" data-action="scenes">体験を切り替える</button>
        <span aria-hidden="true" class="footer-divider"></span>
        <button type="button" data-action="next-day">翌日を試す<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15m-5-5 5 5-5 5"/></svg></button>
      </div>
    </footer>

    <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="announcer" class="sr-only" aria-live="polite"></div>
    <script>
      // Reuse the existing local-only character preview after the page paints.
                              requestAnimationFrame(() => requestAnimationFrame(() => {
                                const script = document.createElement("script");
                                script.src = "../omakase/character.bundle.js";
                                script.onerror = () => window.dispatchEvent(new CustomEvent("yorishiro:character-ready", {
                                  detail: { ok: false, message: "キャラクター用ファイルを読み込めませんでした" },
                                }));
                                document.body.append(script);
                              }));
    </script>
  </body>
</html>
